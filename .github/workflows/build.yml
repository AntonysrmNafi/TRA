name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No separate Android SDK setup step: ubuntu-latest already ships a
      # working Android SDK (this is what earlier successful steps in this
      # workflow build against). The android-actions/setup-android action
      # was tried here at one point, but it fails outright — it tries to
      # install the legacy "tools" package, which Google has removed from
      # the SDK repository, so the whole step errors before anything else
      # even runs. Simpler and more reliable to just use what's preinstalled.

      # No gradlew is checked into this repo, so this step installs Gradle
      # itself and caches it between runs, then generates the wrapper
      # (gradlew + gradle-wrapper.jar) so the build below is reproducible.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tracker-remover-debug
          path: app/build/outputs/apk/debug/*.apk

      # Builds an unsigned release APK too. To publish a signed release,
      # add a signing config in app/build.gradle backed by repo secrets
      # (see README "Signing a release build" section) and switch this
      # to `assembleRelease` with those secrets wired in as env vars.
      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tracker-remover-release-unsigned
          path: app/build/outputs/apk/release/*.apk
